name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Install Playwright browser
        # Required by tests/test_ui_smoke.py (pytest-playwright); the python
        # package is installed via uv sync, but the browser binary lives in
        # ~/.cache/ms-playwright and must be fetched separately. ubuntu-latest
        # carries Chromium's runtime libraries, so --with-deps is unnecessary.
        run: uv run playwright install chromium
      - name: Run tests
        # TODO(after Task 0.2 ships real tests): remove this guard and revert to plain `uv run pytest -v`
        run: |
          set +e
          uv run pytest -v
          status=$?
          # Exit code 5 == "no tests collected"; treat as success until tests exist.
          if [ $status -eq 5 ]; then
            echo "pytest collected no tests yet; treating as success."
            exit 0
          fi
          exit $status
      - name: Run linter
        run: uv run ruff check .
        continue-on-error: true
