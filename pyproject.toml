[project]
name = "agent-spatial-toolkit"
version = "0.0.1"
description = "Convert reference photos of physical components into structured spatial data for LLM agents."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cameron Zucker"},
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3,<4.0",
    "numpy>=2.2.6,<3.0",
    "opencv-python>=4.13.0.92,<5.0",
    "pillow>=12.2.0,<14.0",
]

[project.scripts]
agent-spatial-toolkit = "agent_spatial_toolkit.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.59.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.7.2",
    "reportlab>=4.5.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_spatial_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_spatial_toolkit/calibration/chessboard_a4.pdf" = "agent_spatial_toolkit/calibration/chessboard_a4.pdf"
"src/agent_spatial_toolkit/calibration/chessboard_letter.pdf" = "agent_spatial_toolkit/calibration/chessboard_letter.pdf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
